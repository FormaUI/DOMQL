name: CI

# The gate on every change, on a clean Linux machine of a fixed release, so a new image never changes a result unasked: the tests, the tests in a real browser, the bundle, the package project's build with no warnings, and the format check.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes the older run; every commit on main keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Where Playwright keeps the browser it installs, so the run can cache it.
env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright

# DOMQL builds against the Nexo release nexo.release pins, the tree of its tag, taken from a checkout beside its own, formaui-net.Nexo beside formaui-net.DOMQL, until it consumes Nexo's published package, so each job checks out both, Nexo at that tag.
defaults:
  run:
    working-directory: formaui-net.DOMQL

# Each action is pinned to the commit of the release named in its comment.
jobs:
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    steps:
      # The gated commit alone, since the sources declare every version and nothing reads the history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: formaui-net.DOMQL

      # The tag of the Nexo release DOMQL builds against, which nexo.release pins.
      - name: Read the pinned Nexo release
        id: nexo
        run: echo "tag=v$(tr -d '[:space:]' < nexo.release)" >> "$GITHUB_OUTPUT"

      # Nexo's whole history, since DOMQL's documents link to commits a record of the past names, which the link test reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FormaUI/Nexo
          ref: ${{ steps.nexo.outputs.tag }}
          path: formaui-net.Nexo
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            formaui-net.DOMQL/package-lock.json
            formaui-net.DOMQL/tests/package-lock.json

      # The SDK nuget/global.json pins, which the build requires exactly.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: formaui-net.DOMQL/nuget/global.json

      # The browsers the tests run in, kept for as long as the tests' dependencies, and so Playwright, stay the same.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('formaui-net.DOMQL/tests/package-lock.json') }}

      # The browsers need system libraries that the runner does not have.
      - name: Install the browsers' system libraries
        run: |
          npm ci --prefix tests --no-audit --no-fund
          npx --prefix tests playwright install-deps chromium firefox webkit

      - name: Gate
        shell: pwsh
        run: ./build.ps1 -Browser

  package:
    name: Package
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      # The gated commit alone, since the sources declare every version and nothing reads the history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: formaui-net.DOMQL

      # The tag of the Nexo release DOMQL builds against, which nexo.release pins.
      - name: Read the pinned Nexo release
        id: nexo
        run: echo "tag=v$(tr -d '[:space:]' < nexo.release)" >> "$GITHUB_OUTPUT"

      # Nexo's whole history, since DOMQL's documents link to commits a record of the past names, which the link test reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FormaUI/Nexo
          ref: ${{ steps.nexo.outputs.tag }}
          path: formaui-net.Nexo
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            formaui-net.DOMQL/package-lock.json
            formaui-net.DOMQL/tests/package-lock.json

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: formaui-net.DOMQL/nuget/global.json

      - name: Pack
        shell: pwsh
        run: ./publish.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: formaui-net.DOMQL/artifacts/*.nupkg
          if-no-files-found: error
